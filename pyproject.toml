[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bondi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4", "redis>=5,<7", "httpx>=0.28,<1",
  "google-genai>=1.0,<2", "beautifulsoup4>=4.12,<5",
  "apscheduler>=3.11,<4", "tenacity>=9,<10",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pyyaml>=6,<7"]
[tool.setuptools.packages.find]
include = ["backend*", "agents*"]
[tool.pytest.ini_options]
testpaths = ["agents/tests"]
